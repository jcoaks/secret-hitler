services:
  db:
    image: postgres:15
    container_name: sh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: secret-hitler-backend:latest
    container_name: sh-backend
    restart: unless-stopped
    ports:
      - "4040:4040"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      DEBUG_MODE: ${DEBUG_MODE}
      JAVA_OPTS: ${JAVA_OPTS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: secret-hitler-frontend:latest
    container_name: sh-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      NODE_ENV: ${NODE_ENV}
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
